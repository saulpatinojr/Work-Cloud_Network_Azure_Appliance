name: "340 · Sync Local Keys"
# Pulls all CNA platform secrets from Azure Key Vault and generates a
# populated .env file as a 1-day workflow artifact.
# Run this after infrastructure deployment to validate secrets are present
# and to provide a reference .env for local development or debugging.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment to sync from
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

# One key-sync per environment at a time — overlapping runs would produce
# competing .env artifacts; a newer dispatch supersedes an in-flight one.
concurrency:
  group: sync-keys-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  sync-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Azure login with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Key Vault is deny-by-default (default_action = Deny, identity module).
      # The two steps below read secrets over the data plane, so the runner's
      # public IP is allow-listed first and removed again at the end — the same
      # window 210-deploy and the 350/360 drift workflows open. The vault's
      # resource group is resolved from the vault itself; KEY_VAULT_NAME is
      # repo-level and Terraform writes the environment's real (suffixed) name.
      - name: Ensure Key Vault is reachable from this runner
        run: |
          VAULT="${{ vars.KEY_VAULT_NAME }}"
          if [ -z "$VAULT" ]; then
            echo "::error::KEY_VAULT_NAME variable is not set; run 210 · Deploy first."
            exit 1
          fi
          VAULT_RG=$(az keyvault show --name "$VAULT" --query resourceGroup -o tsv --only-show-errors)
          echo "KEY_VAULT_RG=$VAULT_RG" >> "$GITHUB_ENV"
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -z "$RUNNER_IP" ]; then
            echo "::warning::Could not determine the runner's public IP; Key Vault reads may 403 (ForbiddenByFirewall)."
            exit 0
          fi
          az keyvault network-rule add --name "$VAULT" --resource-group "$VAULT_RG" --ip-address "$RUNNER_IP" --only-show-errors > /dev/null
          # Firewall rule propagation is not immediate — wait until the data
          # plane accepts this runner before reading secrets.
          for i in $(seq 1 18); do
            if az keyvault secret list --vault-name "$VAULT" --maxresults 1 --only-show-errors -o none 2>/dev/null; then
              echo "Key Vault data plane reachable from runner."
              break
            fi
            if [ "$i" = "18" ]; then
              echo "::warning::Key Vault $VAULT data plane still unreachable after ~3 minutes."
            else
              sleep 10
            fi
          done

      - name: Validate required Key Vault secrets exist
        run: |
          VAULT="${{ vars.KEY_VAULT_NAME }}"
          REQUIRED=(
            "cna-applicationinsights-connection-string"
            "cna-database-url"
            "cna-nextauth-secret"
            "cna-entra-client-secret"
          )
          MISSING=()
          for secret in "${REQUIRED[@]}"; do
            STATUS=$(az keyvault secret show --vault-name "$VAULT" --name "$secret" \
              --query attributes.enabled --output tsv 2>/dev/null || echo "missing")
            if [ "$STATUS" != "true" ]; then
              MISSING+=("$secret")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing Key Vault secrets: ${MISSING[*]}"
            echo "Run workflow 211 · Deploy Azure Platform (Split) to create infrastructure and populate secrets."
            exit 1
          fi
          echo "All required secrets are present in Key Vault: $VAULT"

      - name: Pull secrets and generate .env
        run: |
          VAULT="${{ vars.KEY_VAULT_NAME }}"

          get_secret() {
            az keyvault secret show --vault-name "$VAULT" --name "$1" --query value --output tsv
          }

          APPINSIGHTS_CS=$(get_secret "cna-applicationinsights-connection-string")
          DATABASE_URL=$(get_secret "cna-database-url")
          NEXTAUTH_SECRET=$(get_secret "cna-nextauth-secret")
          ENTRA_CLIENT_SECRET=$(get_secret "cna-entra-client-secret")

          cat > .env.${{ inputs.environment }} <<EOF
          # CNA Platform — environment variables (generated ${{ inputs.environment }})
          # Generated by 340-sync-keys.yml on $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # This file is a 1-day artifact. Do NOT commit it to git.

          # ─── Azure ────────────────────────────────────────────────────────────
          AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}

          # ─── GenAI Engine (Azure OpenAI — only supported engine) ──────────────
          CNA_AI_ENGINE_DEFAULT=${{ vars.CNA_AI_ENGINE_DEFAULT }}
          AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT=${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION=${{ vars.AZURE_OPENAI_API_VERSION }}
          CNA_AZURE_MCP_ENDPOINT=${{ vars.CNA_AZURE_MCP_ENDPOINT }}
          CNA_AZURE_MCP_TRANSPORT=${{ vars.CNA_AZURE_MCP_TRANSPORT }}
          CNA_AWS_MCP_ENDPOINT=${{ vars.CNA_AWS_MCP_ENDPOINT }}
          CNA_AWS_MCP_TRANSPORT=${{ vars.CNA_AWS_MCP_TRANSPORT }}
          CNA_DRAWIO_MCP_URL=${{ vars.CNA_DRAWIO_MCP_URL }}

          # ─── Azure Monitoring ─────────────────────────────────────────────────
          APPLICATIONINSIGHTS_CONNECTION_STRING=${APPINSIGHTS_CS}

          # ─── Database ─────────────────────────────────────────────────────────
          DATABASE_URL=${DATABASE_URL}

          # ─── NextAuth ─────────────────────────────────────────────────────────
          NEXTAUTH_URL=${{ vars.CNA_NEXTAUTH_URL }}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

          # ─── Entra ID ─────────────────────────────────────────────────────────
          AZURE_AD_CLIENT_ID=${{ vars.CNA_ENTRA_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
          AZURE_AD_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          EOF

          echo "Generated .env.${{ inputs.environment }}"

      - name: Remove Runner IP from Key Vault
        if: always()
        run: |
          VAULT="${{ vars.KEY_VAULT_NAME }}"
          if [ -z "$VAULT" ] || [ -z "${KEY_VAULT_RG:-}" ]; then
            exit 0
          fi
          RUNNER_IP=$(curl -s https://api.ipify.org || echo "")
          if [ -n "$RUNNER_IP" ]; then
            az keyvault network-rule remove --name "$VAULT" --resource-group "$KEY_VAULT_RG" --ip-address "$RUNNER_IP" --only-show-errors >/dev/null 2>&1 || true
          fi

      - name: Upload .env artifact (1-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: env-${{ inputs.environment }}-${{ github.run_id }}
          path: .env.${{ inputs.environment }}
          retention-days: 1

      - name: Summary
        run: |
          echo "## Env Sync Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`env-${{ inputs.environment }}-${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ The artifact contains secrets and expires in **1 day**." >> "$GITHUB_STEP_SUMMARY"
